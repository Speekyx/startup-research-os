# CI -- extended in Mission 0.3 with the install-dependent gates.
#
# Every job runs a check that genuinely exists and genuinely passes. There is no
# placeholder job, because a permanently red pipeline teaches people to ignore
# all of it (quality-gates.md §5).
#
# The zero-dependency jobs run FIRST and separately from the install-based ones
# (ADR-009 / ADR-010): a broken dependency environment must never be able to
# silently reduce the contract and schema checks to nothing.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ===========================================================================
  # Zero-dependency gates. No install step, so they cannot be skipped because a
  # dependency failed to resolve.
  # ===========================================================================

  contracts:
    name: Contracts (generation is current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated contracts match the source of truth
        run: python packages/contracts/tools/generate.py --check
      - name: Zero-dependency Python suites
        run: python infrastructure/scripts/run_python_tests.py

  schema:
    name: Database schema invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate migrations against ADR-008
        run: python infrastructure/scripts/validate_schema.py
      - name: Migration plan is well formed
        run: python infrastructure/scripts/migrate.py --plan

  source-registry:
    name: Source registry governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zero-dependency on purpose (ADR-009 rationale). This is the gate that
      # says no source was silently approved, and a broken dependency
      # environment must never be able to reduce it to nothing.
      - name: Catalog states, evidence and secrets
        run: python infrastructure/scripts/validate_source_registry.py
      # Mission 1.4. Conditions became clearable, so the gate between an
      # approving review and a collector now has a second half: every condition
      # must resolve to a real verifier, every capability a condition names must
      # pass its own conformance check, and an ineligible source must produce no
      # acquisition authorization. Zero-dependency for the same reason as above.
      - name: Compliance capabilities, verifiers and the acquisition boundary
        run: python infrastructure/scripts/validate_compliance_capabilities.py
      # Mission 1.0 forbade a network client anywhere in this package. Mission
      # 1.5 built a collector, so the ban was NARROWED to one named file rather
      # than deleted -- the same move Mission 1.2 made with the D-03 guard.
      # Naming where the network IS says more than asserting it is absent.
      #
      # §52 still holds: CI itself contacts no external platform. Fetching a
      # source's terms here would be collection, and would make the build depend
      # on a third party's uptime.
      - name: Only the transport module may reach a network
        run: |
          PATTERN='^[[:space:]]*(import|from)[[:space:]]+(requests|httpx|urllib|aiohttp|http[.]client|socket|playwright|selenium)'
          OFFENDERS=$(grep -rlE "$PATTERN" services/acquisition/python/sros_acquisition | grep -v 'collection/transport[.]py$' || true)
          if [ -n "$OFFENDERS" ]; then
            echo "a network client is imported outside collection/transport.py:" >&2
            echo "$OFFENDERS" >&2
            exit 1
          fi
      # The registry and compliance packages DECIDE whether a source may be
      # collected from. A collector inside either would put the decision and its
      # execution in the same place.
      - name: Collectors live only in the collection package
        run: |
          GOVERNANCE=services/acquisition/python/sros_acquisition
          FOUND=$(find "$GOVERNANCE/registry" "$GOVERNANCE/compliance" -name '*collector*.py')
          if [ -n "$FOUND" ]; then
            echo "a collector module is inside a governance package: $FOUND" >&2
            exit 1
          fi

  normalization:
    name: Normalization boundary guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Mission 1.6. Zero-dependency, like the source-registry job and for the
      # same reason: these are the rules a reviewer is least likely to catch,
      # because crossing them looks like ordinary work. No network client, not
      # even the sanctioned transport; no LLM; no embedding library; no signal,
      # claim or evidence table; and the canonical vocabulary in the code must
      # match the contract source of truth.
      - name: Normalization reaches no network, no model and no later stage
        run: python infrastructure/scripts/validate_normalization.py
      - name: Signal derivation reaches no network, no model and no later stage
        run: python infrastructure/scripts/validate_signals.py
      - name: Claim interpretation reaches no network, no model and no later stage
        run: python infrastructure/scripts/validate_claims.py

  evidence-aggregation:
    name: Evidence aggregation guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Zero-dependency, like the source-registry job and for the same reason:
      # D-03 is resolved at the FRAMEWORK level only, and a broken dependency
      # environment must not be able to reduce the gate between a defined
      # framework and production scoring to nothing.
      - name: Rejected designs, source weights, universal half-life
        run: python infrastructure/scripts/validate_evidence_aggregation.py

  typescript:
    name: TypeScript (lint, typecheck, conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck contracts
        run: pnpm exec tsc --noEmit -p packages/contracts/tsconfig.json
      # The web app has its own project: strict settings that the contracts
      # project does not exercise (exactOptionalPropertyTypes,
      # noUncheckedIndexedAccess) caught two real defects in the API client.
      - name: Typecheck web
        run: pnpm --filter @sros/web exec tsc --noEmit -p tsconfig.json
      - name: Lint
        run: pnpm exec eslint .
      # Runs on a bare Node runtime with native type stripping: no build step,
      # and it is the half of the shared conformance suite that proves the
      # TypeScript and Python contracts agree.
      - name: Contract conformance
        run: node --test --experimental-strip-types packages/contracts/test/conformance.test.ts
      # Also install-free: the API client's cross-package imports are type-only
      # and therefore erased, so it runs on a bare Node runtime.
      - name: Web API client
        run: node --test --experimental-strip-types apps/web/test/api-client.test.ts
      # A type error must fail the build, not merely the typecheck: `next build`
      # runs `tsc` over the route types it generates, which the project-level
      # check above cannot see.
      - name: Build web
        run: pnpm --filter @sros/web build

  # ===========================================================================
  # Install-dependent gates, activated in Mission 0.3.
  # ===========================================================================

  python-quality:
    name: Python (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: |
          uv run mypy packages/contracts/python/sros_contracts \
                      packages/llm-gateway/python/sros_llm_gateway \
                      packages/semantic-equivalence/python/sros_semantic_equivalence \
                      packages/opportunity-engine/python/sros_opportunity \
                      services/workers/python/sros_workers \
                      packages/evidence-aggregation/python/sros_evidence_aggregation \
                      packages/signal-model/python/sros_signal_model \
                      packages/claim-model/python/sros_claim_model \
                      packages/inferred-claim-evaluator/python/sros_inferred_claim_evaluator \
                      packages/evidence-reliability/python/sros_evidence_reliability \
                      services/acquisition/python/sros_acquisition \
                      services/nlp/python/sros_nlp \
                      services/research-orchestrator/python/sros_orchestrator \
                      services/gateway/python/sros_gateway
      # The markdown catalog is generated from the JSON one. Two hand-maintained
      # copies of one fact drift, and the drift is discovered by whoever trusted
      # the wrong one (ADR-009, applied to documentation).
      - name: Rendered source catalog is in sync
        run: uv run sros-source render --check
      # The review-results document is the DIFF view -- what each verdict was and
      # what moved it. Generated from the same catalog, checked for the same
      # reason: two hand-maintained copies of one fact drift.
      - name: Source review results are in sync
        run: uv run python infrastructure/scripts/render_review_results.py --check
      # The coverage matrix answers "do we have twenty economic sources and no
      # entertainment sources". Generated from the same catalog for the same
      # reason: an answer nobody regenerates is an answer about last month.
      - name: Source signal coverage is in sync
        run: uv run python infrastructure/scripts/render_signal_coverage.py --check
      # The sensitivity analysis is generated from the reference implementation,
      # so it cannot describe behaviour the code does not have. Same argument as
      # the catalog above, applied to a document that reports findings.
      - name: Sensitivity analysis matches the implementation
        run: uv run python -m sros_evidence_aggregation.sensitivity --check

      # Mission 1.39 §34. The convergence registry rendered into its artifact.
      # It reads repository code and no database, so unlike the calibration
      # feasibility audit it can live here: an empty deployment changes nothing
      # about its output.
      - name: Proposition convergence contract is in sync
        run: uv run python infrastructure/scripts/render_convergence_contract.py --check
      # Mission 1.42a §27. The reliability rubric and its worked example. Reads
      # the rubric module and the checked-in review packet, never a database, so
      # an empty deployment changes nothing about its output.
      - name: Human reliability assessment rubric is in sync
        run: uv run python infrastructure/scripts/render_reliability_rubric.py --check
      # Mission 1.42.1 §3. The completed operator review is AUTHORED, so this
      # checks it conforms to the rubric it names -- states are states, the gate
      # is a gate, the basis is document-backed -- and renders the readable half.
      # It never judges the judgement, and it reads no database.
      - name: Operator reliability review conforms to its rubric
        run: uv run python infrastructure/scripts/render_operator_reliability_review.py --check
      - name: Wikimedia operator reliability review conforms to its rubric
        run: uv run python infrastructure/scripts/render_wikimedia_operator_reliability_review.py --check
      - name: Statistical independence route feasibility is rendered from its record
        run: uv run python infrastructure/scripts/render_statistical_route_feasibility.py --check
      # Mission 1.47 §25/§26. Renders the cross-apparatus feasibility record and
      # refuses the shapes the mission exists to avoid: a selected route with no
      # passing gate, a conjunction recorded as corroboration, a latent construct
      # in a candidate offered as OBSERVED, a moved research counter. Repository
      # file to repository file, so it is deterministic from an empty database.
      #
      # `measure_cross_apparatus_holdings.py` is deliberately NOT checked here:
      # it measures a DEPLOYMENT, and this job starts from an empty one, so the
      # step would be permanently red or loosened until it verified nothing
      # (Mission 1.37).
      - name: Cross-apparatus convergence feasibility is rendered from its record
        run: uv run python infrastructure/scripts/render_cross_apparatus_convergence_feasibility.py --check
      # Mission 1.48 §35. Renders the apparatus-requirements record and refuses
      # the shapes the mission exists to avoid: a monotone proposition family
      # marked falsifiable or contradiction-capable, a preferred family that is
      # monotone, a weighted numeric score where §5 allows only qualitative
      # states, a selected source, a blank requirement, a specification written
      # around a named source, or a moved counter.
      #
      # `measure_falsifiable_apparatus_gap_baseline.py` is deliberately NOT
      # checked here for the usual reason: it measures a DEPLOYMENT, and this
      # job starts from an empty one (Mission 1.37).
      - name: Falsifiable apparatus requirements are rendered from their record
        run: uv run python infrastructure/scripts/render_falsifiable_apparatus_requirements.py --check
      # Mission 1.49 §37. Renders the source-independent Claim semantics record
      # and enforces the ADR-036 invariants: OBSERVED keeps `source_id` as
      # proposition identity, the source-independent layer does not, provenance
      # still carries it per witness, the threshold is identity and the measured
      # value is not, a post-hoc threshold is never calibration-eligible, a
      # semantic mismatch is never CONTRADICTS, and a republication never becomes
      # independent corroboration.
      - name: Source-independent Claim semantics are rendered from their record
        run: uv run python infrastructure/scripts/render_source_independent_claim_semantics.py --check
      # Mission 1.50 §40. Renders the deterministic inferred Claim contract and
      # enforces the ADR-037 decisions: exactly one model selected per mandatory
      # question, threshold provenance never Claim identity, POST_HOC and UNKNOWN
      # never calibration-eligible, a semantic mismatch never CONTRADICTS, UNKNOWN
      # never mapped to an EvidenceDirection, no confidence on an exact
      # entailment, preregistration compared against retrieval rather than
      # publication with its foreknowledge limit stated, and no migration.
      - name: Deterministic inferred Claim contract is rendered from its record
        run: uv run python infrastructure/scripts/render_deterministic_inferred_contract.py --check
      # Mission 1.51 §42. Renders the derivation-provenance schema record and
      # cross-checks it against MIGRATION 0034 itself: the tables it claims must
      # be created there, no foreign key may reference a retention-bounded
      # interpretation run, every non-workspace FK must be NO ACTION DEFERRABLE,
      # NEUTRAL must not be an evaluation result, calibration eligibility must be
      # derived rather than stored, and the migration must contain no DROP,
      # DELETE, TRUNCATE or UPDATE. Both are repository files, so it is
      # deterministic from an empty database.
      - name: Derivation provenance schema matches its migration
        run: uv run python infrastructure/scripts/render_derivation_provenance_schema.py --check
      # Mission 1.52 §42. Renders the deterministic-evaluator record and
      # cross-checks it against the repository rather than against itself: the
      # evaluator package must exist at the path ADR-037 Q3 named, import none of
      # the five forbidden packages, read no clock, reach no database or network
      # client, and expose exactly the four-member EvaluationResult vocabulary.
      # The suite and its one shared path must be registered in the
      # zero-dependency runner, `validate_claims.py` must still restrict the
      # interpreters to OBSERVED, no interpreter may import the evaluator,
      # migration 0034 must still declare `claim_revision_id NOT NULL` (the
      # central finding rests on it), and INFERRED must not appear among the
      # evidence-requirement trigger's exemptions. Every input is a repository
      # file, so it is deterministic from an empty database.
      - name: Deterministic evaluator record matches the package it describes
        run: uv run python infrastructure/scripts/render_deterministic_inferred_evaluator.py --check
      # Mission 1.53 §45. Renders the refusal-provenance design and checks it
      # against the repository rather than against itself: the reason codes it
      # lists must be the ones the evaluator's `_refuse` calls actually raise
      # (read from the AST, because `__all__` entries look identical to a
      # scan), migration 0034 must still declare `claim_revision_id NOT NULL`
      # and the identity key whose NULL behaviour decides Option B, the
      # migration head must not have moved, and `validate_claims.py` must
      # still restrict the interpreters to OBSERVED. It also refuses a record
      # that selects the expiring run logs, stores a key with no preimage, or
      # puts a nullable column in the refusal identity key.
      - name: Refusal provenance design matches the evaluator it describes
        run: uv run python infrastructure/scripts/render_refusal_provenance_design.py --check
      # Mission 1.54 §49. Renders the refusal-provenance schema record and
      # cross-checks it against MIGRATION 0035 itself: the table it names must be
      # created there, its columns and their nullability must match, the identity
      # key must contain every member it claims and every member must be NOT NULL,
      # `claim_revision_id` / `evidence_id` / a supersession column must be absent,
      # no foreign key may reach a retention-bounded interpretation run, the three
      # provenance FKs must be deferrable, RLS must be enabled and forced, and the
      # reason codes must be the ones the evaluator's `_refuse` calls raise. Every
      # scan reads the STATEMENTS rather than the comments, because a migration
      # that explains what it does NOT touch would otherwise fail its own check.
      - name: Refusal provenance schema matches its migration
        run: uv run python infrastructure/scripts/render_refusal_provenance_schema.py --check
      # Mission 1.55 §69. Renders the persistence-orchestration record and checks
      # it against the ORCHESTRATOR's source: the routing must name all four
      # evaluation results and no NEUTRAL, read from the AST because the module
      # explains the routing in prose too; the module must import no aggregator,
      # Gateway, acquisition or Opportunity package; the evaluator must still name
      # neither psycopg nor sros_nlp, which is the dependency direction; the
      # canonical Claim builder must actually be called; idempotency must compare a
      # PAYLOAD rather than trust a key, and must NOT compare evaluator_version;
      # and Policy D must never update, duplicate or delete a standing Evidence row.
      - name: Persistence orchestration matches the module it describes
        run: uv run python infrastructure/scripts/render_persistence_orchestration.py --check
      # Mission 1.56 §15. Renders the three pilot documents and cross-checks the
      # records against each other and against the repository: one candidate named
      # identically by all three, fifteen hard gates each met by something stated,
      # a target proposition whose key RECOMPUTES from its own facts through the
      # real claim model, a canonical subject the reviewed registry already holds,
      # a threshold that is not PREREGISTERED and discloses that the measurement
      # was visible, an equivalence basis checking all eight frozen dimensions with
      # a confidence that is neither 1.0 nor evaluator-invented, and a manifest
      # carrying NO evaluation result. Also prints the manifest SHA-256 the
      # operator's approval names, so a manifest edited after approval renders a
      # different hash.
      - name: Inferred pilot documents match their records
        run: uv run python infrastructure/scripts/render_inferred_pilot.py --check
      # Mission 1.57 §44. Renders the four independence-route records and enforces
      # the decision RULES rather than the answer. A later mission may select a
      # different route; it may not select one by weakening a rule. So: partial
      # lineage evidence stays UNKNOWN and cannot become independence, a route
      # claiming KNOWN_INDEPENDENT carries two-sided documentary basis and none of
      # it may be organisational separateness, the FRED and Eurostat and Wikimedia
      # negative controls must keep failing, a complementary pair cannot become one
      # proposition, a selected route may FAIL no matrix column and must be
      # reliability-reviewable on both sides, the threshold strategy must forbid
      # fetching a value first, and every mutation counter must be zero.
      - name: Independence route records match their decision rules
        run: uv run python infrastructure/scripts/render_independence_route.py --check
      # Mission 1.59 §63. Renders the five gate-closure records and enforces the
      # rules a later mission could most easily bend to make a route pass: a
      # vendor product label may not be the metric, a proprietary fingerprint may
      # not be protocol truth, a scanner name may not enter target identity, a
      # last-change timestamp may not stand in for an observation time, a pairing
      # rule chosen after the values is not preregistrable, gate 10 may not pass
      # from an absence of third-party references, a sampling-frame input is not a
      # measurement upstream, fifteen gates are not sixteen, and PARTIAL is not
      # PASS. Also that no measurement value was fetched and nothing was bought.
      - name: Service-presence gate closure matches its decision rules
        run: uv run python infrastructure/scripts/render_service_presence_route.py --check
      # Mission 1.60 §52. Renders the five selection records and enforces the
      # accumulated refusals of this arc: a current-state database is not
      # observation-addressable however good it is, a vendor label is not a
      # protocol predicate, a timestamp that exists but cannot be selected before
      # retrieval is not addressability, retrieve-then-filter is not
      # preregisterable, an absence is not affirmative lineage, two brand names
      # are not two apparatuses, a free trial is not harmless, a count is not
      # documentation, and a PARTIAL is not a PASS. Also that the dropped
      # apparatus stays a negative control and nothing was fetched or bought.
      - name: Scanner pair selection matches its decision rules
        run: uv run python infrastructure/scripts/render_scanner_pair_selection.py --check

      # Mission 1.61. Checks that an affirmative lineage claim passes A7 only at
      # LEVEL 2 -- an affirmative statement whose exceptions are ENUMERATED and
      # each checked against the load-bearing predicate -- that lineage
      # exhaustiveness is never cited for coverage, that A8 cannot pass while a
      # question is unanswered, that a recovered documentation path is not a
      # qualified apparatus, that no partner is ranked or selected, and that the
      # drafted enquiry is still unsent and still answers to the hash the
      # closure record froze it at. A later edit to the enquiry turns this red
      # rather than leaving an approval beside a document nobody approved.
      - name: Anchor lineage closure matches its decision rules
        run: uv run python infrastructure/scripts/render_anchor_lineage_closure.py --check

      # Mission 1.62. Checks that what bounds a Claim is the frame the acquisition
      # surface EXPOSES rather than the one the apparatus MEASURES; that a
      # collector must bind to a non-default observation-addressable surface;
      # that A7 is never cited as evidence about coverage; that sampling silence
      # stays UNKNOWN; that an absent record is not a negative; that a distinct
      # count is not a row count; that a partial is not a pass and a complete
      # package is not a qualified one; that no pair is compared, ranked or
      # selected; and that Mission 1.61's frozen enquiry still answers to the
      # hash it was frozen at. Editing that enquiry turns this red.
      - name: Operational closure matches its decision rules
        run: uv run python infrastructure/scripts/render_operational_closure.py --check

      # Mission 1.63. Checks that a current port list is not membership in an
      # arbitrary window and list cardinality is not membership history; that a
      # configuration fact published for one data category does not establish it
      # for another; that a configuration endpoint is not executed without proof
      # its response carries no measurement; that an ambiguous timestamp is not
      # resolved in the direction that keeps a candidate alive and is never
      # resolved by querying records; that a raw field named as TRUNCATED is not
      # one REMOVED and finite retention is not automatic disqualification; that
      # fewer than two qualified apparatuses is not pair-ready; and that Mission
      # 1.61's frozen enquiry still answers to its hash.
      - name: Documentation closure matches its decision rules
        run: uv run python infrastructure/scripts/render_documentation_closure.py --check

      # Mission 1.64. Recomputes the approved enquiry's hash on every run, so an
      # edit to the document the operator approved turns this red rather than
      # leaving an approval beside different bytes. Also checks that nothing is
      # sent to an address nobody supplied and no mailbox is inferred; that a
      # dispatch is not an answer and an answer is not a PASS; that an ambiguous
      # record lifecycle is not resolved in the direction that would qualify the
      # last surviving candidate; that a configuration fact is not transferred
      # between data categories; that a field named as truncated is not called
      # removed and unnamed removed fields are not guessed; and that fewer than
      # two qualified apparatuses is not pair-ready.
      - name: Enquiry dispatch matches its decision rules
        run: uv run python infrastructure/scripts/render_enquiry_dispatch.py --check

      # Mission 1.65. Freezes CONTENT_APPROVAL_IS_NOT_DISPATCH_APPROVAL and the
      # three gates that stay separate. Recomputes the Netlas approved body's
      # hash and the ONYPHE envelope hash on every run, so an edit to either the
      # approved document or the bound action turns this red rather than leaving
      # an approval beside different bytes. Also checks that a recipient is
      # judged on PROVENANCE rather than on the spelling of the address; that an
      # envelope naming no recipient carries no approval hash; that a connector
      # present in the runtime is not channel authorisation; that the ONYPHE
      # enquiry asks for no data, access, trial or price and repeats nothing the
      # documentation answers; and that nothing is marked sent.
      - name: Dispatch envelopes match their decision rules
        run: uv run python infrastructure/scripts/render_dispatch_envelope.py --check

      # Mission 1.66. An approval is not an execution. Recomputes the approved
      # content and envelope hashes on every run, so an edit to either after the
      # approval turns this red. Also checks that the approval was not written
      # into the document it approves and the sender placeholder was not
      # replaced there; that SENT requires an explicit operator confirmation and
      # an actual sender, so an approval alone can never produce it; that a
      # reported execution matches the approved recipient, channel and subject,
      # because the hash binds the action rather than the message; that one
      # approval authorises one send; that BYTE_VERIFIED requires a body hash so
      # an attestation cannot be promoted into proof; that a dispatch moves no
      # apparatus gate; and that a provider reply is frozen rather than
      # interpreted.
      - name: Dispatch execution matches its decision rules
        run: uv run python infrastructure/scripts/render_dispatch_execution.py --check

      # Mission 1.66.1. The operator sent the approved enquiry manually and
      # attested to it. Recomputes both frozen hashes, so an attestation about
      # bytes that have since moved is refused. Also checks that Mission 1.66's
      # record keeps its original statement and carries only a forward pointer,
      # because rewriting it would make that mission describe a moment it did
      # not observe; that the frozen envelope's sender placeholder was not
      # replaced with the actual mailbox and the envelope was not marked sent;
      # that the attested recipient, channel, subject and send count match the
      # approved action; that OPERATOR_ATTESTED is not reported as
      # BYTE_VERIFIED while no sent message has been imported and hashed; that
      # the attested send time is after the approval it claims to execute; that
      # an unchecked mailbox establishes NOT_CHECKED and never
      # NO_RESPONSE_EXISTS; and that a SENT question moves no apparatus gate.
      - name: Dispatch attestation matches its record
        run: uv run python infrastructure/scripts/render_dispatch_attestation.py --check

      # Mission 1.66.2. Twelve first-party ONYPHE documents reconciled against
      # the three residual questions. Checks that a retrieval summary is never
      # evidence; that historical retention, "data collected", a latest-first
      # default sort and an older-result function cannot promote B2, because each
      # is compatible with both storage models; that a port-set CARDINALITY is
      # not a MEMBERSHIP and a ctiscan membership is not a datascan fact; that a
      # configuration documented as having CHANGED does not become
      # time-addressable by being documented; that the retention sentence names
      # the truncated field and not the removed ones, so the unnamed ones stay
      # UNKNOWN in both directions; that the User API is not executed and its
      # generic port list is not attributed to datascan; that a support address
      # is cited rather than inferred from spelling; that Mission 1.65 is not
      # rewritten because a later document was found; and that nothing was sent,
      # executed, registered or measured.
      - name: Documentation reconciliation matches its records
        run: uv run python infrastructure/scripts/render_documentation_reconciliation.py --check

      # Mission 1.67. Two new apparatuses evaluated and neither qualifies, so the gate
      # guards the readings that were available and refused: that an apparatus an earlier
      # mission already evaluated cannot be rediscovered as new; that a candidate whose
      # first-party documentation could not be retrieved never becomes serious; that a
      # database documented as updated in real time is a maintained current state however
      # many timestamps it exposes, and a per-address history is not a window-addressable
      # frame; that a SYN response carries no identification string, so a resource
      # publishing one cannot witness a protocol-native predicate even where the
      # apparatus measures that protocol elsewhere; that a count whose unit is
      # undocumented is not a count of distinct addresses; that configuration
      # heterogeneity is neither sampling, nor the retrievable frame, nor
      # time-addressability; that every load-bearing quote names a document this mission
      # actually retrieved rather than a search summary; and that no pair was selected,
      # nothing was executed, and no historical verdict was rewritten to fail the rule
      # this mission adopted.
      - name: Scanner discovery matches its records
        run: uv run python infrastructure/scripts/render_scanner_discovery.py --check

      # Mission 1.68. A construct pivot, so the gate guards the distinctions the pivot
      # made it easy to lose: that a SYN response is a transport-layer fact and never an
      # SSH server however conventionally port 22 is assigned; that an apparatus blocker
      # is global or construct-specific, so a global temporal architecture survives every
      # change of predicate while Sonar's Mission 1.67 rejection correctly does not; that
      # a count of names is never a count of addresses and a distinct-address count is
      # never a row count; that two apparatuses querying different populations are not two
      # routes; that one plausible route is one, and a route needs a named apparatus; that
      # a dated filename is not observation semantics until something says what the date
      # denotes; that Sonar's TCP and HTTP studies are different resources; and that no
      # construct was selected without two routes, no pair was chosen, and nothing was
      # downloaded, executed, registered or measured.
      - name: Construct selection matches its records
        run: uv run python infrastructure/scripts/render_construct_selection.py --check

      # Mission 1.69. A quantity-class pivot, so the gate guards the one distinction the
      # whole mission turns on: a PRODUCER of the quantity against a publisher of somebody
      # else's number. It refuses an aggregator, a mirror or a publisher of a submitted
      # document counted as an independent producer; a route that measures its own events
      # perfectly but not THIS quantity counted as a second witness, which is how a search
      # becomes a content request; a different platform counted as a second route rather
      # than a different population; a provider-defined population called externally
      # frozen; a shared domain list treated as a shared measurement when the request is
      # part of the predicate; strategic viability claimed without two producers, an
      # established proposition, moderate relevance and a bounded pilot; the scanner arc
      # rewritten from parked into refuted; the registry grown without a second instance
      # in a different shape; and any crawl, query, download, registration or measurement.
      - name: Quantity class selection matches its records
        run: uv run python infrastructure/scripts/render_quantity_class_selection.py --check

      # Mission 1.70. A coverage surface is not a population until somebody says what
      # membership in it means. Refuses: a successfully fetched set called a planned
      # target set or an attempted set; a co-coverage rule called preregistered when what
      # it selects on is undefined, so ordering is treated as sufficient; an HTTP status
      # code in a coverage index called metadata; two different observed denominators
      # called one proposition; a dated release treated as an immutable one; a browser
      # page load equated with a crawler fetch, or the main document after redirects
      # treated as the response to the requested URL; Common Crawl's URL selection
      # guessed, or taken from a search summary rather than a first-party page; a
      # recommendation to obtain legal advice read as a grant; an operator-run fetcher
      # treated as independent because we would run it or as authorised because it is
      # feasible; rights feasibility turned into governance approval; a class selected on
      # an unresolved population architecture, or its artifact existing when nothing was
      # selected; a construct selected at all; Mission 1.69's decision record edited; and
      # any crawl, index query, WARC or HAR download, BigQuery execution, registration,
      # governance mutation or measurement.
      - name: Fixed-corpus web route qualification matches its records
        run: uv run python infrastructure/scripts/render_web_route_qualification.py --check

      # Mission 1.71. An operator-run apparatus is only worth building if it publishes what
      # the external routes would not: which items it asked about, which it reached, and why
      # the rest are missing. Refuses: governance feasibility called run authorization, or a
      # verdict claiming LEGAL, COMPLIANT or AUTHORIZED_TO_RUN; a public-looking URL assumed
      # safe; any of the private, loopback, link-local, unique-local, multicast or cloud
      # metadata destination classes unblocked; one passing address treated as validating a
      # host; a redirect destination not revalidated, or DNS rebinding unaddressed; recalled
      # numeric address ranges written into the design; authentication, cookies or JavaScript
      # silently enabled; anti-bot, CAPTCHA or rate-limit circumvention permitted; a refusal
      # retried under a different identity; recursive crawling, sitemap expansion or
      # redirect-driven corpus growth; corpus membership changed after execution begins, or a
      # manifest mutated under an unchanged run identity; a target disappearing without a
      # terminal status; attempted collapsed into successful; a response absence read as
      # removal from the population; missingness dropped, or only positives or only responses
      # stored; an apparatus failure recorded as the target's silence; a retry overwriting a
      # prior attempt; a redirect silently changing the measured entity; query strings
      # stripped while claiming the same target; arbitrary full-body retention assumed; a run
      # missing its apparatus, corpus or request-contract hash, or its software provenance;
      # unlabeled local timestamps; self-operation treated as independence, or two local
      # processes as two independence groups; Mission 1.70's Common Crawl and HTTP Archive
      # findings rewritten; a counterpart, class or construct selected; and any target
      # request, crawl, index query, BigQuery execution, credential read, mailbox search,
      # source registration, canonical mutation, Claim, Evidence, reliability or model call.
      - name: Bounded HTTP apparatus design matches its records
        run: uv run python infrastructure/scripts/render_bounded_http_apparatus.py --check

      # Mission 1.72. Which gate applies is a function of what is RETAINED, never a label the
      # caller chooses. Refuses: the observation track weakening source collection, or any
      # target becoming a source; arbitrary web ingestion called measurement, or a
      # body-retaining profile expressible inside the observation track; the caller choosing
      # its own track, or observation winning when both could apply; governance feasibility
      # called run authorization; a run without a purpose, corpus hash, request-contract hash,
      # apparatus contract or load profile; an eligibility requirement defaulting to approval
      # when unknown; a robots condition with no deterministic outcome, a stricter-than-RFC row
      # that does not say so, a robots request uncounted, or a wildcard group evaluated when a
      # specific one exists; a persisted body, a non-allowlisted or secret-bearing header, an
      # allowlist a run could widen into that set, or a raw Location retained; a retention value
      # presented as evidence-derived; a known restriction ignored, unknown terms read as
      # permission, an exclusion set changed mid-run, or an excluded target removed from the
      # population; an unbounded concurrency, rate, redirect, retry, byte or duration limit, a
      # per-target budget too small for its own redirects, or a load number lacking
      # PROJECT_POLICY_DEFAULT provenance; and any counterpart search, class or construct
      # selection, target request, source registration, canonical mutation or model call.
      - name: Public HTTP observation governance matches its records
        run: uv run python infrastructure/scripts/render_public_http_governance.py --check

      # Mission 1.73. The producer of an observation is not the brand on the API, and a
      # contract that is merely implemented is not a contract that is documented. Refuses:
      # a reseller, a proxy, an unknown producer, or the SROS fetcher on somebody else's
      # cloud counted as a counterpart; shared software treated as shared measurement, or a
      # different vantage treated as independence; an externally triggered job called
      # SROS-produced; a candidate obtaining its observations from Common Crawl, HTTP
      # Archive or SROS; a target directable only through the provider's own search; a
      # provider job failure recorded as target silence; a body ingested in order to read a
      # status, or a transport-only path claimed with no mechanism; a request contract called
      # established with unknown fields, or an observed implementation treated as a
      # documented contract; a browser page load equated with a single GET; a free API read
      # as commercial permission, terms silence read as permission, a consumer-scoped clause
      # read as a blanket prohibition, or provider terms replacing ADR-039; a counterpart
      # qualified while a mandatory gate is not PASS, or rejected with no hard FAIL; Q1
      # selected with no qualified counterpart; the no-counterpart outcome reported while a
      # candidate is UNRESOLVED; a construct or counterpart selected; and any counterpart API
      # execution, target request, account, trial, credential read, source registration,
      # canonical mutation or model call.
      - name: Independent HTTP counterpart qualification matches its records
        run: uv run python infrastructure/scripts/render_counterpart_qualification.py --check

      # Mission 1.74. Two residuals narrowed, neither closed, and nothing sent. The
      # validator refuses: an implementation promoted to a provider contract; a dependency
      # default treated as a commitment; zero documentation matches read as proof the
      # provider does not redirect; a source test treated as a public API guarantee; a
      # commercial-use FAQ answer treated as third-party-target permission; a
      # consumer-scoped clause applied to business users; a schema acceptance treated as a
      # Terms grant; product design or examples overriding the Terms; a reservation clause
      # read as a general prohibition; prohibited-use silence turned into a grant; Terms
      # ambiguity turned into a prohibition; two Terms versions merged; R2 passing on one
      # half; C6 or C9 passing while its residual is open; a qualified verdict with a
      # PARTIAL dimension; a class selected without a qualified counterpart; an enquiry
      # marked sent, approved or dispatched; a guessed recipient; a packet edited under a
      # frozen hash; ADR-039 weakened anywhere; and any measurement, target request,
      # account, token, credential read, source registration, canonical mutation or model
      # call.
      - name: Globalping residual closure matches its records
        run: uv run python infrastructure/scripts/render_globalping_residuals.py --check

      # Mission 1.74.1. One enquiry approved for dispatch by a named mechanism, and
      # nothing posted. AN APPROVAL IS NOT AN EXECUTION, and that is easy to lose here
      # because once the approval exists every field an execution record needs is already
      # known. The validator refuses: an approval that no longer names the packet as
      # stored; an approval written into the packet it approves; a packet edited to say it
      # was approved or sent; an action digest that does not recompute, or that hashes its
      # own value, the execution status or the date; a changed mechanism, target, identity
      # or title under an unchanged hash; an execution claiming a post with no operator
      # attestation; BYTE_VERIFIED with no URL to verify against; more posts than the one
      # authorised; R2 carried along by an approval that named R1; Mission 1.74's records
      # rewritten; and any issue, gh invocation or GitHub API call made by this repository.
      - name: R1 dispatch approval matches its record
        run: uv run python infrastructure/scripts/render_r1_dispatch_approval.py --check

      # Mission 1.74.2. The second enquiry approved, by a different mechanism to a
      # different kind of channel -- and the rules INVERT against the gate above. A public
      # repository is determined before the act and a mail client's sender is not, so this
      # approval pins three fields of four; a public issue has a durable URL and a mail
      # client's outbox does not, so this gate REFUSES BYTE_VERIFIED where the R1 gate
      # requires it be possible. The validator refuses: an approval that no longer names
      # the packet as stored; an approval written into the packet; a digest that does not
      # recompute or that hashes its own value, the status, the date or the sender; a
      # changed mechanism, recipient or subject under an unchanged hash; a real mailbox
      # pinned as sender; BYTE_VERIFIED claimed for a channel that cannot produce it; a
      # send with no operator attestation; more than the one send authorised; any mail
      # sent, connector executed or mailbox searched by this repository; and any edit to
      # Mission 1.74's records or to the R1 approval's binding fields.
      - name: R2 dispatch approval matches its record
        run: uv run python infrastructure/scripts/render_r2_dispatch_approval.py --check

      # Mission 1.74.4. The Terms-designated address rejected delivery, so a replacement
      # recipient was reviewed and a second packet prepared. Two rules carry this gate: a
      # SUPPLIED address is a claim, established on provenance or not at all; and an
      # established GENERAL CONTACT is not a DESIGNATED channel. The validator refuses: a
      # packet whose digest does not recompute; a v2 reusing v1's digest; an edited v1; a
      # changed subject or body claimed as preserved; a recipient absent from every
      # reviewed first-party surface; an address accepted because it was supplied, or
      # inferred from convention, or judged on its spelling; a general contact promoted to
      # the Terms-designated channel with no provider document designating it; a review
      # resting on a rendered shell rather than committed source; one rejected attempt
      # turned into a permanently dead address; a replacement prepared with no failed
      # attempt recorded; an exhausted approval whose digest or recipient would reach the
      # replacement; and any send, approval, connector use or mailbox search.
      - name: R2 replacement packet matches its records
        run: uv run python infrastructure/scripts/render_r2_replacement_packet.py --check

  # ===========================================================================
  # Integration: real PostgreSQL, Redis and Qdrant via service containers.
  # Pinned to the same versions as infrastructure/compose.
  #
  # No external paid API is contacted, and no LLM provider call is ever made
  # (Mission 0.3 §37): the gateway suite uses test doubles.
  # ===========================================================================

  integration:
    name: Integration (PostgreSQL, Redis, Qdrant)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: sros
          POSTGRES_PASSWORD: sros_dev_password
          POSTGRES_DB: sros
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sros -d sros"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports: ["6333:6333"]
    env:
      # 127.0.0.1, never `localhost`: on some runners `localhost` resolves to
      # ::1 first and every connection pays an IPv6 timeout before falling back.
      DATABASE_URL: postgresql://sros:sros_dev_password@127.0.0.1:5432/sros
      REDIS_URL: redis://127.0.0.1:6379/0
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen

      - name: Apply migrations against an empty database
        run: uv run python infrastructure/scripts/migrate.py --apply --seed

      - name: Migrations are idempotent on a second run
        run: uv run python infrastructure/scripts/migrate.py --apply

      # Five packages, including the row-level-security suite. Every isolation
      # assertion uses two workspaces: a tenancy suite with one workspace cannot
      # detect a missing tenant filter (ADR-005).
      - name: Integration, tenant-isolation and RLS suites
        run: uv run python infrastructure/scripts/run_pytest_suites.py

      # §20: no provider key reaches CI, and the smoke tests stay off. Asserted
      # rather than trusted -- a suite that quietly became enabled would show up
      # as an invoice rather than as a red build.
      # The registry applied to a real database. `load` is idempotent; the
      # assertion after it is the one that matters. Resolving D-07 approved no
      # source, and a build in which one had quietly become collectable should
      # be red (§31).
      # `load` is idempotent and grants nothing; `verify --apply` is what can
      # change eligibility, and it runs here rather than being assumed so the
      # assertion below sees the state a real deployment would have.
      #
      # No credential is present in CI, so FRED's CONFIG_REFERENCE condition
      # resolves NOT_CONFIGURED and FRED stays blocked. That is the §17
      # distinction working: the compliance capability exists, the runtime
      # credential does not, and CI proves the first without needing the second.
      - name: Source registry loads, verifies, and grants nothing unverified
        run: |
          uv run sros-source load
          uv run sros-source verify --apply
          uv run python infrastructure/scripts/assert_registry_grants_nothing.py
      # §53. The collector's authorization path, against the real registry in
      # the database. Reaches no network: `validate` answers whether a
      # collection WOULD be permitted, which is a governance question.
      - name: The collector authorization path holds
        # Mission 1.15.5. The runtime DECLARES the use profile it operates
        # under; it is never inferred, and there is no default. CI declares the
        # legacy profile because that is the one world-bank's approving review
        # assessed -- and the step failing without it is the mechanism working.
        env:
          SROS_USE_PROFILE: commercial-multi-tenant-research-v1
        run: uv run sros-acquisition world-bank validate --indicator SP.POP.TOTL
      # Mission 1.6 §58. Which sources can be normalized, and by what. Reaches
      # no network AND no database: normalizer selection is a property of the
      # code and the reviewed configuration, not of the deployment.
      - name: The normalizer selection path holds
        run: uv run sros-normalize validate

      # Mission 1.4 §17 adds FRED_API_KEY to this list. CI must not have one:
      # a source that became runnable because a build secret was added would be
      # a source nobody decided to make runnable.
      - name: No provider or source credential is present
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$GEMINI_API_KEY" ] || [ -n "$FRED_API_KEY" ]; then
            echo "a credential is exposed to CI; no job here needs one" >&2
            exit 1
          fi
          test "${SROS_ENABLE_PROVIDER_SMOKE_TESTS:-0}" = "0"
          # §12, §52: the World Bank live suite is opt-in and CI never
          # enables it. A suite that quietly became enabled would show up as
          # traffic to a third party rather than as a red build.
          test "${SROS_ENABLE_WORLD_BANK_SMOKE_TESTS:-0}" = "0"
      # `.env.example` is committed, so a value in it is a published secret.
      - name: The environment template carries no credential value
        run: |
          if grep -nE '^[A-Z_]*(API_KEY|SECRET|TOKEN|PASSWORD)=.+' infrastructure/compose/.env.example \
             | grep -vE '=sros_dev_password$'; then
            echo "infrastructure/compose/.env.example contains a value for a credential key" >&2
            exit 1
          fi

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        working-directory: infrastructure/compose
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet
