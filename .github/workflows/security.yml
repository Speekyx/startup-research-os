# Security -- enabled in Mission 0.2, BEFORE ci.yml.
#
# A credential committed on day one is compromised whether or not a test suite
# exists, and reverting the commit does not un-leak it. That is why this
# workflow is the first one turned on.
#
# The secret scan is never path-filtered and never skipped: it is the one gate
# whose failure is unrecoverable (quality-gates.md §5 rule 1).

name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret in an earlier commit on the branch is just as
          # leaked as one in the tip commit.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # A committed environment template must never contain a populated credential.
  # This is cheap, stdlib-only, and catches the most likely accidental leak in
  # this repository: someone filling in .env.example instead of .env.
  # ---------------------------------------------------------------------------
  env-template:
    name: Environment template carries no secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check .env.example
        run: python infrastructure/scripts/check_env_template.py

  # ---------------------------------------------------------------------------
  # Dependency audit, activated in Mission 0.3 now that both lockfiles exist.
  # Reports rather than blocks on the JS side for now: a brand-new gate that is
  # red on day one gets ignored, taking the useful signal with it.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level high
        continue-on-error: true

      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages --frozen
      - name: pip-audit
        run: uv run pip-audit
        continue-on-error: true

# ---------------------------------------------------------------------------
# Deliberately still not enabled, so that nothing here is permanently red:
#
#   CodeQL          -- needs a compiled application surface worth analysing.
#   injection suite -- needs services/nlp to exist (llm-reasoning-rules.md §7).
# ---------------------------------------------------------------------------
