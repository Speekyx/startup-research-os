# gitleaks configuration.
#
# One allowlist entry, deliberately narrow, and verified against the scanner
# rather than assumed.
#
# WHAT THIS MUST NOT DO
#
# `docs/data/source-compliance-v1.json` is precisely the file a real credential
# would be most tempting to put in: it is where FRED's configuration key NAME
# lives, and Mission 1.4 built three guards to keep the VALUE out of it.
# Suppressing the scanner across the whole file would quietly remove the fourth.
#
# WHY IT LOOKS LIKE THIS
#
# Three earlier versions of this file were wrong in ways that all LOOKED right,
# and each was caught by running gitleaks 8.24.3 against probe cases rather than
# by reading the config:
#
#   1. `[[rules]] id = "generic-api-key"` with an attached allowlist REPLACED
#      the built-in rule. Carrying no `regex` of its own it matched nothing, and
#      an injected AWS key in the same file went undetected;
#   2. a top-level `[[allowlists]]` (plural) was not applied at all -- neither
#      the path clause nor the regex clause had any effect;
#   3. `paths = ['docs/data/...']` matched on Linux and not on Windows, because
#      gitleaks reports paths with the host separator. It would have behaved one
#      way in CI and another on a contributor's machine;
#   4. `paths` AND `regexes` together, with `condition = "AND"`, allowlisted the
#      WHOLE FILE. The singular `[allowlist]` table does not honour `condition`
#      in 8.24.3 -- any clause matching is enough -- so the path clause alone
#      suppressed an injected AWS key. Verified, not read.
#
# Hence: NO path clause. The allowlist is two exact secret VALUES and nothing
# else. They are rule identifiers rather than credentials, so allowlisting them
# repository-wide costs nothing, and every other finding in that file -- or any
# file -- is still reported.

[extend]
useDefault = true

[allowlist]
description = """
Four identifiers that are not credentials, matched by exact value.

`"key"` in source-compliance-v1.json is the stable identifier of an enumerated
resource-exclusion rule. Two values: the Eurostat trade-data carve-outs the
copyright notice names -- Liechtenstein and Switzerland as declaring countries
from 1995, and Austria at CN 8-digit.

`indicators-api-v2` (added in Mission 1.6) is the World Bank ACCESS PROFILE
LABEL. It is already published in source-catalog-v1.json, source-compliance-v1.json,
the rendered catalog and world-bank-collector-v1.md, and it is printed by
`sros-acquisition world-bank validate`. It tripped `generic-api-key` because it
sits next to a key containing "access" and has entropy above the threshold --
`"access_profile": "indicators-api-v2"`.

It is not a credential and structurally cannot become one: a credential in this
system is a CONFIGURATION KEY NAME in `secret_references`, and
validate_source_registry.py refuses a value there.

`e452cf18...` (added in Mission 1.56) is a PROPOSITION KEY: the SHA-256 of the
canonical facts of one INFERRED Claim, `sha256(canonical_json(facts))`. It tripped
`generic-api-key` on two counts at once -- the JSON key ends in `_key`, and 64 hex
characters have high entropy -- which is exactly the shape a real credential has
and exactly why the rule exists.

It is not a credential and structurally cannot become one. It is DERIVED from
facts printed two lines below it in the same file, it is RECOMPUTED from those
facts by `render_inferred_pilot.py` and by the evaluator suite, and a value that
does not recompute is refused. A secret nobody can regenerate from public data is
the opposite of a hash everybody can.

This is the first proposition key committed to the repository -- until Mission
1.56 they existed only as database rows -- so a later mission committing another
will need its own entry here. That cost is deliberate: a `^[0-9a-f]{64}$` pattern
would have covered all of them and would also have suppressed a large fraction of
real API keys, which is the trade this file already refused once.

Matched by exact VALUE, with no path clause, so a real key added to any of these
files later is still caught -- which is the property that matters.
"""
# Applied to the extracted SECRET (`li-ch-trade-1995`), not to the whole match
# (`"key": "li-ch-trade-1995"`). Anchored, so a longer string that merely
# contains one of these is not allowlisted by accident.
regexes = [
  '''^li-ch-trade-1995$''',
  '''^at-trade-cn8$''',
  '''^indicators-api-v2$''',
  '''^e452cf18200011aa65da75ebea5a0036bd49b2a365612dc3bbb2db8963ba2684$''',
]
regexTarget = "secret"
