[project]
name = "sros-semantic-extraction"
version = "0.1.0"
description = "N08-B offline extractor: versioned prompt, forced strict tool, request construction and response interpretation for per-record semantic extraction. Holds no transport, constructs no provider, calls no model and persists nothing."
requires-python = ">=3.12"
# The contract for what may be extracted, and the Gateway types for how a request is expressed. Nothing
# else: not sros-acquisition (a component that could read the source registry could authorise itself),
# not sros-nlp (the signal layer forbids model code), and no provider or transport module.
dependencies = ["sros-contracts", "sros-llm-gateway", "sros-semantic-extraction-contract"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_semantic_extraction"]
