[project]
name = "sros-opportunity"
version = "0.1.0"
description = "Opportunity Engine foundation: evidence dimensions, packets, eligibility and hypothesis sufficiency (Mission 1.28)."
requires-python = ">=3.12"
# It depends on contracts for the shared vocabulary and on NOTHING ELSE.
#
# Not on `sros-acquisition`: an engine able to read the source registry could
# decide its own authorization, which is the argument Mission 1.24 made for the
# semantic-equivalence package and it holds identically here. Governance
# decisions are PASSED IN as value objects.
#
# Not on `sros-llm-gateway`: Mission 1.28 builds the deterministic path only, and
# a package that cannot import a provider cannot call one by accident.
#
# Not on `sros-semantic-equivalence`: the parked problem-family classifier is not
# a dependency of opportunity formation (Mission 1.28 §6), asserted over the AST
# rather than promised here.
#
# No database driver and no network client.
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_opportunity"]
