[project]
name = "sros-semantic-extraction-contract"
version = "0.1.0"
description = "Contract for per-record model-derived semantic extraction (roadmap N08-A): text surface, label registry, deterministic validator and fingerprints. Contains no prompt, no model call, no network and no persistence."
requires-python = ">=3.12"
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_semantic_extraction_contract"]
