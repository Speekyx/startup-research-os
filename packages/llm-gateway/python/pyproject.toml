[project]
name = "sros-llm-gateway"
version = "0.1.0"
description = "Provider-agnostic LLM Gateway (ADR-006). No provider SDK is a dependency."
requires-python = ">=3.12"
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_llm_gateway"]
