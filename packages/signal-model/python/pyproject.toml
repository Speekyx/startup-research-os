[project]
name = "sros-signal-model"
version = "0.1.0"
description = "The Signal contract: what a derived signal IS. Contains no extractor."
requires-python = ">=3.12"
# Standard library plus the canonical contracts. No network client, no model, no
# embedder: this package must run in the zero-dependency CI job (ADR-009), and a
# Signal model that could reach a provider would stop being a model.
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_signal_model"]
