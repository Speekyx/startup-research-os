[project]
name = "sros-evidence-reliability"
version = "0.1.0"
description = "Reviewed reliability: the assessment scope, its basis, and the fail-closed resolver. Names no source."
requires-python = ">=3.12"
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_evidence_reliability"]
