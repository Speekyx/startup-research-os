[project]
name = "sros-inferred-claim-evaluator"
version = "0.1.0"
description = "Deterministic evaluation of source-native measurements against source-independent INFERRED propositions. Contains no acquisition, no reliability, no independence and no aggregation."
requires-python = ">=3.12"
dependencies = ["sros-contracts", "sros-claim-model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_inferred_claim_evaluator"]
