[project]
name = "sros-semantic-equivalence"
version = "0.1.0"
description = "Semantic problem-equivalence: candidate generation, rubric, classifier and evaluation (Mission 1.24)."
requires-python = ">=3.12"
# It depends on the LLM Gateway because classification IS a model call, and on
# contracts for the shared vocabulary. It depends on NOTHING else -- in
# particular not on `sros-acquisition`, because a classifier that could read the
# source registry could decide its own authorization, and not on `sros-nlp`,
# whose validator forbids a model import anywhere in the package.
#
# No database driver and no network client: the candidate generator is pure over
# observations handed to it, and every provider call goes through the Gateway.
dependencies = ["sros-contracts", "sros-llm-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_semantic_equivalence"]
