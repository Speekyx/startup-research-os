[project]
name = "sros-claim-model"
version = "0.1.0"
description = "The Claim/Evidence interpretation contract. Contains no interpreter."
requires-python = ">=3.12"
dependencies = ["sros-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_claim_model"]
