[project]
name = "sros-nlp"
version = "0.1.0"
description = "Deterministic signal extraction. No model, no embedding, no network."
requires-python = ">=3.12"
dependencies = ["sros-contracts", "sros-signal-model"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_nlp"]
