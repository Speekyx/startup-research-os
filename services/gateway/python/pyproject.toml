[project]
name = "sros-gateway"
version = "0.1.0"
description = "FastAPI gateway: the only public entry point (service-boundaries.md)."
requires-python = ">=3.12"
dependencies = [
    "sros-contracts",
    "sros-llm-gateway",
    "sros-orchestrator",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "redis>=5.0,<6",
    # Pinned to the server minor (compose pins qdrant v1.11.0). A wide range
    # let the client resolve to 1.19, which is API-incompatible with the
    # pinned server. Client and server move together.
    "qdrant-client>=1.11,<1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_gateway"]
