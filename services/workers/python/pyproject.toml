[project]
name = "sros-workers"
version = "0.1.0"
description = "Celery infrastructure (ADR-004). Infrastructure only, no business jobs."
requires-python = ">=3.12"
dependencies = [
    "sros-contracts",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_workers"]
