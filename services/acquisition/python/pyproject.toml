[project]
name = "sros-acquisition"
version = "0.1.0"
description = "Source registry and governance. Collection itself is not implemented."
requires-python = ">=3.12"
# No database driver and no HTTP client. The registry is governance metadata:
# it is loaded, validated and queried, and nothing here reaches a network.
# A collector will add its own dependencies when D-07's per-source gate opens.
dependencies = ["sros-contracts"]

[project.scripts]
sros-source = "sros_acquisition.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sros_acquisition"]
